<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>패턴 탐지 배치 실행</title>
<style>
  body { background:#12151c; color:#dfe4ee; font:14px/1.7 -apple-system,'Malgun Gothic',sans-serif; padding:32px; max-width:900px; margin:0 auto; }
  h1 { font-size:20px; }
  p.hint { color:#8892a6; }
  button { background:#4dd0a7; border:0; color:#0d1017; font-weight:700; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  pre { background:#0d1017; border:1px solid #232935; border-radius:8px; padding:16px; white-space:pre-wrap; margin-top:20px; max-height:60vh; overflow:auto; }
  code { color:#f2b134; }
</style>
</head>
<body>
<h1>패턴 자동 탐지 — 배치 실행</h1>
<p class="hint">
  <code>data/stocks/</code> 의 모든 종목에 <code>src/lib/patterns.js</code> 의 규칙을 적용해,
  결과를 <code>data/patterns/{pattern-id}.json</code> 으로 저장합니다.<br />
  데이터를 새로 받았거나 탐지 규칙을 고쳤을 때 다시 실행하세요.
  (<code>tools/serve.ps1</code> 로 띄운 로컬 서버에서만 저장이 동작합니다)
</p>
<button id="run">탐지 실행 후 저장</button>
<pre id="log">대기 중…</pre>

<script type="module">
import { loadIndex, loadStock } from '../src/lib/data.js';
import { detectStock, mergeDetections, PATTERN_IDS, PATTERNS, OUTCOME_DAYS } from '../src/lib/patterns.js';

const logEl = document.getElementById('log');
const lines = [];
const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };

document.getElementById('run').addEventListener('click', async (e) => {
  e.target.disabled = true;
  lines.length = 0;
  try {
    const index = await loadIndex();
    log(`종목 ${index.length}개 로드 시작…`);

    const perStock = [];
    for (const row of index) {
      const stock = await loadStock(row.ticker);
      const t0 = performance.now();
      const res = detectStock(stock);
      const total = Object.values(res).reduce((a, b) => a + b.length, 0);
      perStock.push(res);
      log(`  ${row.ticker} (${row.name}) ${stock.candles.length}봉 → ${total}건  [${(performance.now() - t0).toFixed(0)}ms]`);
    }

    const merged = mergeDetections(perStock);
    log('');

    for (const id of PATTERN_IDS) {
      const hits = merged[id].sort((a, b) => (a.date < b.date ? -1 : 1));
      const payload = {
        pattern: id,
        name: PATTERNS[id].name,
        lesson: PATTERNS[id].lesson,
        summary: PATTERNS[id].summary,
        rules: PATTERNS[id].rules,
        outcomeDays: OUTCOME_DAYS,
        generatedAt: new Date().toISOString().slice(0, 10),
        count: hits.length,
        hits,
      };
      const body = JSON.stringify(payload);
      const r = await fetch(`/_write?path=data/patterns/${id}.json`, { method: 'POST', body });
      log(`${r.ok ? '저장' : '실패'} ${id}.json — ${hits.length}건 (${(body.length / 1024).toFixed(0)} KB) ${r.ok ? '' : await r.text()}`);
    }
    log('\n완료. data/patterns/ 를 확인하세요.');
  } catch (err) {
    log('오류: ' + err.message);
    console.error(err);
  } finally {
    e.target.disabled = false;
  }
});
</script>
</body>
</html>
