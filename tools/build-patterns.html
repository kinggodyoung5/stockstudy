<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>패턴 탐지 배치 실행</title>
<style>
  body { background:#12151c; color:#dfe4ee; font:14px/1.7 -apple-system,'Malgun Gothic',sans-serif; padding:32px; max-width:900px; margin:0 auto; }
  h1 { font-size:20px; }
  p.hint { color:#8892a6; }
  button { background:#4dd0a7; border:0; color:#0d1017; font-weight:700; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  pre { background:#0d1017; border:1px solid #232935; border-radius:8px; padding:16px; white-space:pre-wrap; margin-top:20px; max-height:60vh; overflow:auto; font-size:12.5px; }
  code { color:#f2b134; }
</style>
</head>
<body>
<h1>패턴 자동 탐지 — 배치 실행</h1>
<p class="hint">
  <code>data/stocks/</code> 의 모든 종목에 탐지 엔진(<code>src/lib/engine.js</code>)의 모든 규칙을 적용해,
  결과를 <code>data/patterns/{pattern-id}.json</code> 과 요약 <code>data/patterns/_index.json</code> 으로 저장합니다.<br />
  데이터를 새로 받았거나 탐지 규칙을 고쳤을 때 다시 실행하세요.
  (<code>tools/serve.ps1</code> 로 띄운 로컬 서버에서만 저장이 동작합니다)
</p>
<button id="run">탐지 실행 후 저장</button>
<pre id="log">대기 중…</pre>

<script type="module">
import { loadStockList, loadStock } from '../src/lib/data.js';
import { detectStock, mergeDetections, ALL_PATTERNS, ALL_PATTERN_IDS, groupOf } from '../src/lib/engine.js';
import { OUTCOME_DAYS } from '../src/lib/outcome.js';
import { summarize, baseline, profileOf, assignBuckets, AXES } from '../src/lib/stats.js';
import { atrPercent } from '../src/lib/oscillators.js';

/** 저장할 사례 최대 개수. 전체 건수는 count 에 그대로 남기고, 예시는 고르게 뽑아 담는다. */
const MAX_HITS = 150;

const logEl = document.getElementById('log');
const lines = [];
const log = (s) => { lines.push(s); logEl.textContent = lines.join('\n'); logEl.scrollTop = logEl.scrollHeight; };

/** 종목이 한쪽으로 쏠리지 않게 고르게 샘플링 */
function sample(hits, max) {
  if (hits.length <= max) return hits;
  const byTicker = new Map();
  for (const h of hits) {
    if (!byTicker.has(h.ticker)) byTicker.set(h.ticker, []);
    byTicker.get(h.ticker).push(h);
  }
  const buckets = [...byTicker.values()];
  const picked = [];
  let round = 0;
  while (picked.length < max && round < 10000) {
    let added = false;
    for (const b of buckets) {
      if (round < b.length) { picked.push(b[round]); added = true; }
      if (picked.length >= max) break;
    }
    if (!added) break;
    round++;
  }
  return picked.sort((a, b) => (a.date < b.date ? -1 : 1));
}

document.getElementById('run').addEventListener('click', async (e) => {
  e.target.disabled = true;
  lines.length = 0;
  try {
    const index = await loadStockList();
    log(`규칙 ${ALL_PATTERN_IDS.length}개 · 종목 ${index.length}개`);

    const perStock = [];
    const stocks = [];
    for (const row of index) {
      const stock = await loadStock(row.ticker);
      stocks.push(stock);
      const t0 = performance.now();
      const res = detectStock(stock);
      const total = Object.values(res).reduce((a, b) => a + b.length, 0);
      perStock.push(res);
      log(`  ${row.ticker} (${row.name}) ${stock.candles.length}봉 → ${total}건  [${(performance.now() - t0).toFixed(0)}ms]`);
    }

    const merged = mergeDetections(perStock);

    // 비교 기준선: 아무 날이나 샀을 때의 20거래일 성과.
    // 이게 없으면 어떤 패턴의 승률 55%가 좋은 건지 나쁜 건지 알 수 없다.
    const base = baseline(stocks, OUTCOME_DAYS);

    // 종목 분류 — 유동성·변동성·시장 3축.
    // 신호가 주로 어느 종목군에서 터지는지, 그 종목군의 기준선은 얼마인지 봐야
    // 승률 비교가 의미를 갖는다.
    const profiles = assignBuckets(stocks.map((s) => profileOf(s, atrPercent(s.candles, 14))));
    const bucketOf = Object.fromEntries(profiles.map((p) => [p.ticker, p]));
    const stockOf = Object.fromEntries(stocks.map((s) => [s.ticker, s]));

    const axisBaselines = {};
    for (const [axis, def] of Object.entries(AXES)) {
      axisBaselines[axis] = {};
      for (const key of def.keys) {
        const subset = profiles.filter((p) => p[axis] === key).map((p) => stockOf[p.ticker]);
        axisBaselines[axis][key] = subset.length ? baseline(subset, OUTCOME_DAYS) : null;
      }
      const line = def.keys
        .map((k) => `${def.labels[k]} ${axisBaselines[axis][k] ? axisBaselines[axis][k].winRate + '%' : '-'}`)
        .join('  ·  ');
      log(`  ${def.name} 기준선 → ${line}`);
    }
    log(`\n기준선 (아무 날이나 매수, ${OUTCOME_DAYS}거래일 보유): 상승 비율 ${base.winRate}% · 평균 ${base.avgChange > 0 ? '+' : ''}${base.avgChange}% · 표본 ${base.samples.toLocaleString()}건\n`);

    const summaryRows = [];
    let totalBytes = 0;
    let grandTotal = 0;

    for (const id of ALL_PATTERN_IDS) {
      const meta = ALL_PATTERNS[id];
      const hits = merged[id].sort((a, b) => (a.date < b.date ? -1 : 1));
      grandTotal += hits.length;
      const stats = summarize(hits);

      // 이 신호가 어느 종목군에서 나왔고, 그 안에서 성과가 어땠는지
      const byAxis = {};
      for (const [axis, def] of Object.entries(AXES)) {
        byAxis[axis] = {};
        for (const key of def.keys) {
          const sub = hits.filter((h) => bucketOf[h.ticker] && bucketOf[h.ticker][axis] === key);
          byAxis[axis][key] = sub.length ? { count: sub.length, stats: summarize(sub) } : null;
        }
      }
      const kept = sample(hits, MAX_HITS);

      const payload = {
        pattern: id,
        name: meta.name,
        lesson: meta.lesson,
        group: groupOf(id),
        bias: meta.bias || 'none',
        summary: meta.summary,
        rules: meta.rules,
        outcomeDays: OUTCOME_DAYS,
        baseline: base,
        generatedAt: new Date().toISOString().slice(0, 10),
        count: hits.length,
        sampled: kept.length < hits.length,
        stats,
        byAxis,
        hits: kept,
      };
      const body = JSON.stringify(payload);
      totalBytes += body.length;
      const r = await fetch(`/_write?path=data/patterns/${id}.json`, { method: 'POST', body });
      log(`${r.ok ? '저장' : '실패'} ${id.padEnd(28)} ${String(hits.length).padStart(5)}건` +
          (stats ? `  승률 ${String(stats.winRate).padStart(5)}%  평균 ${stats.avgChange > 0 ? '+' : ''}${stats.avgChange}%` : '') +
          `  (${(body.length / 1024).toFixed(0)} KB)${r.ok ? '' : ' ' + await r.text()}`);

      summaryRows.push({
        pattern: id, name: meta.name, lesson: meta.lesson, group: groupOf(id),
        bias: meta.bias || 'none', summary: meta.summary,
        count: hits.length, stats, byAxis,
      });
    }

    const indexBody = JSON.stringify({
      generatedAt: new Date().toISOString().slice(0, 10),
      outcomeDays: OUTCOME_DAYS,
      tickers: index.length,
      tickerNames: index.map((r) => r.name),
      from: index.reduce((m, r) => (r.from < m ? r.from : m), index[0].from),
      to: index.reduce((m, r) => (r.to > m ? r.to : m), index[0].to),
      totalHits: grandTotal,
      baseline: base,
      axes: AXES,
      axisBaselines,
      profiles,
      patterns: summaryRows,
    });
    const ri = await fetch('/_write?path=data/patterns/_index.json', { method: 'POST', body: indexBody });
    log(`\n${ri.ok ? '저장' : '실패'} _index.json (요약 ${summaryRows.length}개)`);
    log(`\n완료. 규칙 ${ALL_PATTERN_IDS.length}개, 총 ${grandTotal.toLocaleString()}건 검출, 저장 용량 ${(totalBytes / 1024 / 1024).toFixed(2)} MB`);
  } catch (err) {
    log('오류: ' + err.message + '\n' + err.stack);
    console.error(err);
  } finally {
    e.target.disabled = false;
  }
});
</script>
</body>
</html>
